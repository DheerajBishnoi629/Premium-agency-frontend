<header
  class="sticky top-0 z-40 w-full border-b border-white/10 bg-slate-950/80 backdrop-blur supports-[backdrop-filter]:bg-slate-950/60"
>
  <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="flex items-center gap-2.5" aria-label="Premium Agency — home">
      <img
        src="/logo.png"
        alt="Premium Agency"
        width="40"
        height="40"
        class="h-10 w-10 rounded-md object-cover ring-1 ring-white/10"
      />
      <span class="hidden text-sm font-semibold tracking-[0.18em] uppercase text-white sm:inline">
        Premium <span class="text-amber-400">Agency</span>
      </span>
    </a>

    <ul class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="text-emerald-400"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="text-sm font-medium text-slate-300 transition-colors hover:text-white"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <a
      routerLink="/contact"
      class="hidden rounded-full bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950 transition-colors hover:bg-emerald-400 md:inline-flex"
    >
      Start a project
    </a>

    <button
      type="button"
      (click)="toggleMobile()"
      class="inline-flex items-center justify-center rounded-md p-2 text-slate-200 md:hidden"
      [attr.aria-expanded]="mobileOpen()"
      aria-label="Toggle navigation"
    >
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        @if (mobileOpen()) {
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </nav>

  @if (mobileOpen()) {
    <div class="border-t border-white/10 bg-slate-950 md:hidden">
      <ul class="space-y-1 px-4 py-4">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="bg-white/5 text-emerald-400"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMobile()"
              class="block rounded-md px-3 py-2 text-base font-medium text-slate-200 hover:bg-white/5"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</header>
