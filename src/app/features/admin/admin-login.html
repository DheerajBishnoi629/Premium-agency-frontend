<section class="flex min-h-screen items-center justify-center bg-slate-950 px-4 py-16 text-slate-100 sm:px-6">
  <div class="w-full max-w-md">
    <a routerLink="/" class="inline-flex items-center gap-3" aria-label="Premium Agency — home">
      <img
        src="/logo.png"
        alt="Premium Agency"
        width="48"
        height="48"
        class="h-12 w-12 rounded-md object-cover ring-1 ring-white/10"
      />
      <span class="text-sm font-semibold tracking-[0.18em] uppercase text-white">
        Premium <span class="text-amber-400">Agency</span>
      </span>
    </a>

    <div class="mt-8 rounded-2xl border border-white/10 bg-white/[0.02] p-8 shadow-2xl shadow-black/40">
      <h1 class="text-2xl font-semibold tracking-tight text-white">Sign in to Admin</h1>
      <p class="mt-2 text-sm text-slate-400">
        Use <span class="font-mono text-slate-300">admin&#64;premium.agency</span> /
        <span class="font-mono text-slate-300">premium2026</span> for the demo.
      </p>

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        novalidate
        class="mt-8 space-y-5"
        aria-describedby="login-error"
      >
        <!-- Email -->
        <div>
          <label for="login-email" class="block text-sm font-medium text-slate-200">Email</label>
          <input
            id="login-email"
            type="email"
            autocomplete="email"
            formControlName="email"
            [attr.aria-invalid]="isInvalid('email')"
            aria-describedby="login-email-error"
            class="mt-2 block w-full rounded-xl border bg-white/[0.03] px-4 py-3 text-white placeholder-slate-500 transition-colors focus:outline-none focus:ring-2"
            [class]="
              isInvalid('email')
                ? 'border-rose-400/60 focus:border-rose-400 focus:ring-rose-400/30'
                : 'border-white/10 focus:border-emerald-400 focus:ring-emerald-400/30'
            "
            placeholder="you@studio.com"
          />
          @if (errorFor('email'); as msg) {
            <p id="login-email-error" class="mt-2 text-xs text-rose-300">{{ msg }}</p>
          }
        </div>

        <!-- Password -->
        <div>
          <label for="login-password" class="block text-sm font-medium text-slate-200">
            Password
          </label>
          <div class="relative mt-2">
            <input
              id="login-password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              formControlName="password"
              [attr.aria-invalid]="isInvalid('password')"
              aria-describedby="login-password-error"
              class="block w-full rounded-xl border bg-white/[0.03] px-4 py-3 pr-12 text-white placeholder-slate-500 transition-colors focus:outline-none focus:ring-2"
              [class]="
                isInvalid('password')
                  ? 'border-rose-400/60 focus:border-rose-400 focus:ring-rose-400/30'
                  : 'border-white/10 focus:border-emerald-400 focus:ring-emerald-400/30'
              "
              placeholder="••••••••"
            />
            <button
              type="button"
              (click)="toggleShowPassword()"
              [attr.aria-pressed]="showPassword()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md p-2 text-slate-400 transition-colors hover:bg-white/5 hover:text-white"
            >
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                @if (showPassword()) {
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0112 6c5 0 9 4 10 6-.5 1-1.7 2.6-3.4 3.9M6.4 6.4C4.1 7.9 2.5 10 2 12c1 2 5 6 10 6 1.8 0 3.4-.5 4.8-1.3M9.9 9.9a3 3 0 004.2 4.2" />
                } @else {
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                }
              </svg>
            </button>
          </div>
          @if (errorFor('password'); as msg) {
            <p id="login-password-error" class="mt-2 text-xs text-rose-300">{{ msg }}</p>
          }
        </div>

        @if (errorMessage(); as err) {
          <div
            id="login-error"
            role="alert"
            class="flex items-start gap-2 rounded-xl border border-rose-400/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-200"
          >
            <svg class="mt-0.5 h-4 w-4 flex-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.86l-8.18 14.17A2 2 0 003.84 21h16.32a2 2 0 001.72-2.97L13.7 3.86a2 2 0 00-3.4 0z" />
            </svg>
            <span>{{ err }}</span>
          </div>
        }

        <button
          type="submit"
          [disabled]="status() === 'submitting'"
          class="inline-flex w-full items-center justify-center gap-2 rounded-full bg-emerald-500 px-6 py-3 text-sm font-semibold text-slate-950 shadow-lg shadow-emerald-500/20 transition-all hover:-translate-y-0.5 hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0"
        >
          @if (status() === 'submitting') {
            <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" />
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z" />
            </svg>
            Signing in…
          } @else {
            Sign in
          }
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-500">
      Trouble signing in?
      <a routerLink="/contact" class="text-emerald-400 hover:text-emerald-300">Contact support</a>
    </p>
  </div>
</section>
